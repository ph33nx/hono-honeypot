telemetry = false

# Supply-chain cooldown. Do not resolve npm versions younger than 7 days (604800s).
# Requires Bun >= 1.3.
#
# This package ships ZERO runtime dependencies, so nothing here reaches a consumer's
# node_modules. The window exists for a different reason: `prepublishOnly` runs the
# build, so a compromised build-time dependency (tsup, typescript) would be baked
# into the published `dist/` and installed by every downstream project. That makes
# this a publish-time artifact chain, not a dev convenience, which is why it runs the
# longer window rather than a shorter one.
#
# A `*` in `bun outdated` means a newer version exists and the cooldown is holding it
# back. That is the feature working. Never bypass it to take a bump.
[install]
minimumReleaseAge = 604800
