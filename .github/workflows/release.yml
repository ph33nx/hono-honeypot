name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'patch | minor | major'
        required: false
        default: 'patch'
  # push:
  #   branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Bump version
        run: |
          npm version ${{ github.event.inputs.version_bump || 'patch' }} --no-git-tag-version

      - name: Publish to npm
        run: |
          npm install -g npm@latest
          npm publish --access public --provenance

      # The tag MUST be annotated (`git tag -a`). `git push --follow-tags` pushes only
      # annotated tags and silently drops lightweight ones, so the old `git tag "v$VERSION"`
      # tagged locally, reported success, and pushed nothing: every release from v1.0.3 to
      # v1.4.0 shipped to npm with no tag on the repo. Verified against git directly, not
      # inferred. `git push origin main "v$VERSION"` then names both refs explicitly rather
      # than relying on that filter at all, so a future change to the tag style cannot
      # reintroduce a silent no-op.
      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          git add package.json
          git commit -m "release: v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin main "v$VERSION"
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"
